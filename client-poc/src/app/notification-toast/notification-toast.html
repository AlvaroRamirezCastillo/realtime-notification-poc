<article class="toast" role="status" aria-live="polite" aria-atomic="true">
  <span class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z" stroke-linejoin="round" />
    </svg>
  </span>
  <div class="content">
    <h2>Nueva notificación</h2>
    <p>{{ message() }}</p>
  </div>
  <button type="button" (click)="closed.emit()" aria-label="Cerrar notificación">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      aria-hidden="true"
    >
      <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
    </svg>
  </button>
</article>
