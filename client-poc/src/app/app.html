<main>
  <h1>Notificaciones personales</h1>
  <button type="button" (click)="connect()">
    Escuchar
  </button>

  <ul>
    @for (notification of realtime.notifications(); track notification.id) {
      <li>
        {{ notification.isNew ? 'Nueva' : 'Existente' }}
        <pre>{{ notification.data | json }}</pre>
      </li>
    } @empty {
      <li>Sin notificaciones.</li>
    }
  </ul>
</main>

<router-outlet />
